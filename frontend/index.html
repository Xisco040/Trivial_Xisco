<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trivial de peliculas, un juego de preguntas y respuestas sobre cine.">
    <meta name="author" content="Xisco Sbert">
    <title>Trivial de Películas</title>
    <link rel="shortcut icon" href="./img/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <h1>🎬 Trivial de Peliculas</h1>

        <button id="btn-volver-inicio" onclick="volverAlInicio()" class="btn">Volver al inicio</button>

        <div id="create-join-room">
            <input type="text" id="username" placeholder="Nom d'usuari">
            <button onclick="crearSala()">Crear Sala</button>
            <input type="text" id="room-code" placeholder="Codi de sala">
            <button onclick="unirseSala()">Unirse a una Sala</button>
        </div>
    </div>
</body>
